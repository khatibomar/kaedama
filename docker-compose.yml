services:
  kaedama:
    build: .
    image: kaedama:latest
    container_name: kaedama
    restart: unless-stopped
    ports:
      - "4140:4140"
    environment:
      - ENV=development
      - PORT=4140
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - CACHE_TTL=300
      - REQUEST_TIMEOUT=30000

    networks:
      - kaedama-network

networks:
  kaedama-network:
    driver: bridge
